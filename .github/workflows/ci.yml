name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only, and only for this repository. No other token or secret is used except the RPC URL.
permissions:
  contents: read

env:
  PONDER_TELEMETRY_DISABLED: "true"

jobs:
  commit-message-policy:
    name: commit message policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/check-commit-policy.sh --self-test
      - name: check every commit
        run: |
          rev=HEAD
          if [ "${{ github.event_name }}" = "pull_request" ]; then rev="${{ github.event.pull_request.head.sha }}"; fi
          scripts/check-commit-policy.sh "$rev"

  check:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: no Solidity source in this repo
        run: |
          if git ls-files | grep -iE '\.sol$'; then echo "Solidity source found"; exit 1; fi
      - name: generated ABI module matches abis/*.json
        run: |
          pnpm gen:abis-ts
          git diff --exit-code -- src/generated/abis.ts
      - run: pnpm typecheck
      - run: pnpm test

  fork:
    name: fork tests
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 45
    env:
      READER_ARB_RPC_URL: ${{ secrets.READER_ARB_RPC_URL }}
    steps:
      - name: require the RPC secret
        run: |
          if [ -z "$READER_ARB_RPC_URL" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              echo "::notice::fork tests skipped: secrets are not available to pull requests from forks"
              echo "SKIP_FORK=1" >> "$GITHUB_ENV"
            else
              echo "::error::Actions secret READER_ARB_RPC_URL is not set"
              exit 1
            fi
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SKIP_FORK != '1'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: env.SKIP_FORK != '1'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.SKIP_FORK != '1'
        with:
          node-version: "22"
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        if: env.SKIP_FORK != '1'
        with:
          version: v1.5.1
      - run: pnpm install --frozen-lockfile
        if: env.SKIP_FORK != '1'
      # The harness captures anvil and indexer output and prints it only redacted, on failure.
      - run: pnpm test:fork
        if: env.SKIP_FORK != '1'
