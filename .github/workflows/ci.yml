name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only, and only for this repository. No other token or secret is used except the two RPC URLs.
permissions:
  contents: read

env:
  PONDER_TELEMETRY_DISABLED: "true"

jobs:
  commit-message-policy:
    name: commit message policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: scripts/check-commit-policy.sh --self-test
      - name: check every commit
        run: |
          rev=HEAD
          if [ "${{ github.event_name }}" = "pull_request" ]; then rev="${{ github.event.pull_request.head.sha }}"; fi
          scripts/check-commit-policy.sh "$rev"

  check:
    name: typecheck + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The official validator, pinned; it reads only the files and needs no login or secret. Exit 1 on an error.
      - name: plugin and marketplace manifests validate
        env:
          CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
        run: npx --yes @anthropic-ai/claude-code@2.1.319 plugin validate . && npx --yes @anthropic-ai/claude-code@2.1.319 plugin validate --profile directory plugins/nablaz
      # The reader's four RPC env names live in packages/reader/src/chains.ts; a literal anywhere else fails.
      - name: reader env-names guard
        run: scripts/check-env-names.sh --self-test && scripts/check-env-names.sh
      - name: no Solidity source in this repo
        run: |
          if git ls-files | grep -iE '\.sol$'; then echo "Solidity source found"; exit 1; fi
      - name: generated ABI module matches abis/*.json
        run: |
          pnpm --filter @nablaz/sdk gen:abis-ts
          git diff --exit-code -- packages/sdk/src/generated/abis.ts
      - run: pnpm typecheck
      - run: pnpm test

  fork:
    name: fork tests
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 45
    # Two lab Actions secrets, one per chain, map into the five env names the fork suites read: both reader RPC
    # roles per chain (src/rpc.ts; the roles test tells them apart by proxy), and the env variable READER_ARB_RPC_URL,
    # which packages/sdk reads for the Arbitrum One RPC. The secrets are lab-only, never the production reader's.
    env:
      READER_ARB_RPC_URL: ${{ secrets.READER_LAB_ARB_RPC_URL }}
      READER_ARBITRUM_RPC_URL: ${{ secrets.READER_LAB_ARB_RPC_URL }}
      READER_ARBITRUM_GROUNDING_RPC_URL: ${{ secrets.READER_LAB_ARB_RPC_URL }}
      READER_BASE_RPC_URL: ${{ secrets.READER_LAB_BASE_RPC_URL }}
      READER_BASE_GROUNDING_RPC_URL: ${{ secrets.READER_LAB_BASE_RPC_URL }}
    steps:
      # The fork tests run on Arbitrum One and Base (R-S189-1). A missing secret fails the job; it never skips.
      - name: require the RPC secrets
        run: |
          missing=""
          [ -z "$READER_ARB_RPC_URL" ] && missing="$missing READER_LAB_ARB_RPC_URL"
          [ -z "$READER_BASE_RPC_URL" ] && missing="$missing READER_LAB_BASE_RPC_URL"
          if [ -n "$missing" ]; then
            if [ "${{ github.event_name }}" = "pull_request" ] && [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              echo "::notice::fork tests skipped: secrets are not available to pull requests from forks"
              echo "SKIP_FORK=1" >> "$GITHUB_ENV"
            else
              echo "::error::Actions secret(s) not set:$missing. The fork tests read both chains and do not skip."
              exit 1
            fi
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SKIP_FORK != '1'
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        if: env.SKIP_FORK != '1'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: env.SKIP_FORK != '1'
        with:
          node-version: "22"
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1.9.1
        if: env.SKIP_FORK != '1'
        with:
          version: v1.5.1
      - run: pnpm install --frozen-lockfile
        if: env.SKIP_FORK != '1'
      # The harness captures anvil and indexer output and prints it only redacted, on failure.
      - run: pnpm test:fork
        if: env.SKIP_FORK != '1'
